window.FamilyRooms={
 async join(code,host){
  return await new Promise((resolve,reject)=>{
   const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
   const callbacks={};let settled=false;
   ws.onopen=()=>ws.send(JSON.stringify({type:'join',code,host}));
   ws.onerror=()=>{if(!settled)reject(new Error('Connection failed'))};
   ws.onmessage=e=>{
    let m;try{m=JSON.parse(e.data)}catch{return}
    if(m.type==='ready'){settled=true;resolve({
      on(t,cb){(callbacks[t]??=[]).push(cb)},
      emit(t,data){return new Promise((ok,no)=>{if(ws.readyState!==1)return no(Error('Disconnected'));ws.send(JSON.stringify({type:'event',event:t,data}));ok()})}
    });return}
    if(m.type==='event')for(const cb of callbacks[m.event]||[])cb({data:m.data,isMe:false});
    if(m.type==='error'&&!settled)reject(Error(m.message));
   };
   ws.onclose=()=>{if(!settled)reject(Error('Disconnected'))};
  })
 }
};

function attemptPhysicalLay(){

 const q=H[G.hn],hand=G.hands[me];
 // A legal complete collection of staged cards is submitted without an action button.
 // The player chooses the cards; the game only validates after placement.
 if(staging.length<q.q.reduce((a,b)=>a+b[1],0))return;
 const pool=staging.slice();
 const solution=solve(pool,q.q,q.d);
 if(!solution)return;
 // Don't lay down unchosen cards: every card in each submitted meld was staged by hand.
 const chosen=solution.map(m=>m.ids);
 if(G.hn===7&&hand.length!==chosen.flat().length)return;
 send({t:'lay',g:chosen});

}

 const mh=G.melds.length?'<div class="mp">'+G.melds.map((m,i)=>`<div class="mm" data-m="${i}"><small>${G.pl[m.o].name}</small><div>${m.ids.map(c=>`<span class="mc ${[1,2].includes(su(c))?'r':''} ${''}">${RK[rk(c)]||rk(c)}${SU[su(c)]}</span>`).join('')}</div></div>`).join('')+'</div>':'';

 else if(a=='n-'&&G.n>4){G.n--;sync()}else if(a=='n+'&&G.n<16){G.n++;sync()}

 }
 else if(a==='confirmdown'){

 else if(a.startsWith('undo-private-')){

 else if(a=='lm'){lm=true;sel=null;grp=[...staging];gps=[]}else if(a=='ag'){if(grp.length){gps.push(grp);grp=[]}}else if(a=='ug'){if(grp.length)grp=[];else gps.pop()}else if(a=='cl'){lm=false;grp=[];gps=[]}else if(a=='lg'){if(grp.length){gps.push(grp);grp=[]}send({t:'lay',g:gps})}

<div id="gr3dUI"><span id="gr3dCaption">Opening the box…</span><button id="gr3dSkip">Skip intro</button></div>
<script>
// Cinematic tabletop props are rendered by V15's existing Three.js camera and renderer.
(()=>{
 const ui=document.getElementById('gr3dUI'), caption=document.getElementById('gr3dCaption');
 const root=new THREE.Group();sc.add(root);root.visible=false;
 const make=(geo,material,parent=root)=>{const m=new THREE.Mesh(geo,material);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m};
 const leather=new THREE.MeshStandardMaterial({color:0x55251c,roughness:.78,metalness:.02});
 const dark=new THREE.MeshStandardMaterial({color:0x261610,roughness:.88});
 const gold=new THREE.MeshStandardMaterial({color:0xb88b4d,metalness:.65,roughness:.32});
 const paper=new THREE.MeshStandardMaterial({color:0xf4ead6,roughness:.94});
 function artTexture(back=false){
  const c=document.createElement('canvas');c.width=512;c.height=704;const g=c.getContext('2d');
  g.fillStyle=back?'#77252b':'#49261d';g.fillRect(0,0,512,704);
  g.strokeStyle='#c79d5a';g.lineWidth=12;g.strokeRect(21,21,470,662);g.lineWidth=3;g.strokeRect(39,39,434,626);
  g.save();g.translate(256,352);
  for(let j=0;j<4;j++){g.rotate(Math.PI/2);g.strokeStyle='#d9b77b';g.lineWidth=5;g.beginPath();g.moveTo(-70,0);g.bezierCurveTo(-35,-32,35,-32,70,0);g.stroke();}
  g.restore();g.textAlign='center';g.fillStyle='#f4d49b';g.shadowColor='#120b08';g.shadowBlur=10;
  g.font='bold 53px Georgia';g.fillText('GARBAGE',256,222);g.font='bold 76px Georgia';g.fillText('RUMMY',256,300);
  g.font='italic 30px Georgia';g.fillText(back?'THE ORIGINAL CARD GAME':'FAMILY CARD GAME',256,505);
  g.font='26px Georgia';g.fillText('★  ★  ★',256,557);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;
 }
 const boxArt=new THREE.MeshStandardMaterial({map:artTexture(false),roughness:.69});
 const backArt=new THREE.MeshStandardMaterial({map:artTexture(true),roughness:.56,side:THREE.DoubleSide});
 // One shared Garbage Rummy card-back texture for ALL in-game cards,
 // including the players' hands, draw/discard animation, and intro props.
 // Preserve the existing card faces and V15 animation logic.
 bk.map=backArt.map;
 bk.color.set(0xffffff);
 bk.needsUpdate=true;

 const caseGroup=new THREE.Group();root.add(caseGroup);
 // Lying-flat, physically scaled tuck box; top opens from the far edge.
 const shell=make(new THREE.BoxGeometry(.205,.056,.287),[leather,leather,leather,leather,leather,leather],caseGroup);
 shell.position.y=.034;
 const front=make(new THREE.PlaneGeometry(.185,.267),boxArt,caseGroup);front.rotation.x=-Math.PI/2;front.position.set(0,.063,0);
 const hinge=new THREE.Group();hinge.position.set(0,.063,-.144);caseGroup.add(hinge);
 const lid=make(new THREE.BoxGeometry(.208,.013,.288),leather,hinge);lid.position.set(0,.005,.144);
 const label=make(new THREE.PlaneGeometry(.19,.269),boxArt,hinge);label.rotation.x=-Math.PI/2;label.position.set(0,.013,.144);
 const flap=make(new THREE.BoxGeometry(.18,.003,.045),leather,hinge);flap.position.set(0,.004,.307);
 const decks=new THREE.Group();root.add(decks);
 const deckBase=make(new THREE.BoxGeometry(.097,.045,.141),paper,decks);deckBase.position.y=.024;
 const deckFace=make(new THREE.PlaneGeometry(.096,.139),backArt,decks);deckFace.rotation.x=-Math.PI/2;deckFace.position.y=.048;
 const deckEdges=[];
 for(let i=0;i<12;i++){const line=make(new THREE.BoxGeometry(.097,.00035,.141),paper,decks);line.position.y=.005+i*.0037;deckEdges.push(line)}
 const cardGeo=new THREE.BoxGeometry(.091,.0014,.131);
 const cardMats=[paper,backArt];
 const reveal=new THREE.Group();root.add(reveal);const revealCard=make(cardGeo,[paper,paper,backArt,backArt,paper,paper],reveal);revealCard.visible=false;let revealing=false;
 const flyers=[];let active=false,epoch=0,total=0,count=4,per=7,stage=-1;
 let hiddenCards=[];
 function hideHands(){restoreHands();handG.visible=false;dyn.traverse(o=>{if(o.isMesh&&o.userData&&o.userData.grOpeningOpponentCard){hiddenCards.push(o);o.visible=false}})}
 function restoreHands(){handG.visible=true;hiddenCards.forEach(o=>{o.visible=true});hiddenCards=[]}
 const ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
 function removeFlyers(){for(const f of flyers){root.remove(f.mesh);f.mesh.geometry.dispose()}flyers.length=0}
 function card(){const m=make(cardGeo,[paper,paper,backArt,backArt,paper,paper]);return m}
 function stop(){active=false;window.gr3dDealing=false;root.visible=false;revealCard.visible=false;ui.classList.remove('show');removeFlyers();restoreHands();if(typeof build3d==='function')build3d()}
 document.getElementById('gr3dSkip').onclick=stop;
 function begin(){stop();active=true;window.gr3dDealing=true;hideHands();epoch=performance.now()/1000;count=Math.max(2,G?.pl?.length||4);per=H?.[G?.hn]?.n||7;total=count*per;stage=-1;revealing=false;revealCard.visible=false;root.visible=true;ui.classList.add('show');caseGroup.visible=true;decks.visible=false;caseGroup.position.set(-.07,.795,-.08);caseGroup.rotation.set(0,-.22,0);decks.position.set(-.07,.81,-.08);hinge.rotation.x=0;}
 // Startup shuffle/deal animation disabled at player request. Cards appear immediately.
 const originalDeal=deal;deal=function(hn){const result=originalDeal.apply(this,arguments);stop();return result};
 function seatTarget(seat,round){
  // Messy but stable piles: each card has a repeatable offset and rotation,
  // and rests ABOVE the cards already dealt to this player.
  const theta=typeof ang==='function'?ang(seat):seat*2*Math.PI/count;
  const radius=.96;
  const jitterX=Math.sin((round+1)*12.9898+seat*23.17)*.032;
  const jitterZ=Math.cos((round+1)*7.334+seat*17.31)*.023;
  const spin=Math.sin(round*9.19+seat*4.7)*.21;
  return {point:new THREE.Vector3(Math.sin(theta)*radius+jitterX,
    .803+round*.0023,
    Math.cos(theta)*radius+jitterZ),spin};
 }
 function tick(){if(!active)return;handG.visible=false;dyn.traverse(o=>{if(o.isMesh&&(o.userData.grOpeningOpponentCard||o.userData.pile==='p'||o.userData.pile==='d'))o.visible=false});const t=performance.now()/1000-epoch;
  // Keep all props at tabletop height: V15 table top is y=.78.
  if(t<1.25){
   caption.textContent='Opening the Garbage Rummy box';
   hinge.rotation.x=-2.12*ease((t-.28)/.8);
   decks.visible=false;
  }else if(t<2.45){
   caption.textContent='Taking out the cards';
   hinge.rotation.x=-2.12;decks.visible=true;
   const e=ease((t-1.25)/1.05);
   decks.position.set(-.07+.19*e,.812+.07*Math.sin(Math.PI*e),-.08-.025*e);
   decks.rotation.y=-.22+.22*e;
   caseGroup.position.x=-.07-.45*ease((t-1.6)/.85);
   caseGroup.position.z=-.08-.17*ease((t-1.6)/.85);
   caseGroup.rotation.y=-.22-.45*ease((t-1.6)/.85);
  }else if(t<5.4){
   caption.textContent='Riffle shuffling the decks';caseGroup.visible=false;decks.visible=false;
   const q=t-2.45,phase=q%1.42,pass=Math.floor(q/1.42);
   const desired=52;
   while(flyers.length<desired){const i=flyers.length,m=card();flyers.push({mesh:m,i})}
   // Two bent halves riffle together, then arch upward and bridge down as one deck.
   // Each individual card bends in its trajectory (rather than a rigid deck rotating).
   const cycle=phase/1.42;
   caption.textContent=cycle<.52?'Riffle shuffling the cards':'Bridging the shuffled deck';
   for(const f of flyers){
    const i=f.i,half=i%2,idx=Math.floor(i/2),u=idx/25;
    let x,z,y,rx=0,rz=0;
    if(cycle<.52){
      const m=ease((cycle-.12)/.38),side=half?-1:1;
      // Separate bowed halves, released alternately into an interleaved stack.
      x=side*.105*(1-m)+(u-.5)*.006;
      z=(u-.5)*.16*(1-m)+(i/52-.5)*.025*m;
      y=.811+.027*Math.sin(Math.PI*u)*(1-m)+.001*i*m;
      rx=side*.14*(1-m);rz=-side*.24*Math.sin(Math.PI*u)*(1-m);
    }else{
      const b=ease((cycle-.52)/.48);
      const arch=Math.sin(Math.PI*u);
      // Bridge: the interleaved pack bends into an inverted arch, then springs flat.
      x=(u-.5)*.155*(1-b)+(u-.5)*.008*b;
      z=(i/52-.5)*.045*(1-b);
      y=.814+(.13*Math.sin(Math.PI*b))*arch*(1-b*.55)+.0004*i;
      rx=(u-.5)*.42*Math.sin(Math.PI*b);
      rz=-(u-.5)*.72*Math.sin(Math.PI*b);
    }
    f.mesh.position.set(x,y,z);
    f.mesh.rotation.set(rx,0,rz);
    f.mesh.visible=phase<1.4;
   }
  }else if(t<5.4+total*.34+.30+.22){
   caption.textContent='Dealing '+per+' cards into each player’s pile';
   if(stage!==4){removeFlyers();stage=4}
   const elapsed=t-5.4,interval=.34,flight=.29;
   const n=Math.min(total,Math.floor(elapsed/interval)+1);
   for(let i=flyers.length;i<n;i++){
    const mesh=card();flyers.push({mesh,i,start:i*interval,end:seatTarget(i%count,Math.floor(i/count))});
   }
   for(const f of flyers){
    const u=ease((elapsed-f.start)/flight),from=new THREE.Vector3(0,.856,0);
    f.mesh.position.lerpVectors(from,f.end.point,u);
    f.mesh.position.y+=.23*Math.sin(Math.PI*u);
    f.mesh.rotation.y=(1-u)*.08+u*(Math.atan2(f.end.point.x,f.end.point.z)+f.end.spin);
    f.mesh.rotation.z=.12*Math.sin(Math.PI*u);
    f.mesh.visible=true;
   }
  }else{
   // The dealt cards settle, the stock is placed, then its top card turns face-up.
   if(stage!==5){removeFlyers();stage=5;decks.visible=true;decks.position.set(-.43,.779,.18);decks.rotation.set(0,.1,0);revealCard.visible=true;}
   const q=t-(5.4+total*.34+.30+.22);
   if(q<.55){caption.textContent='Placing the draw deck';revealCard.visible=false;decks.scale.setScalar(.75+.25*ease(q/.55));}
   else{
     caption.textContent='Turning over the opening card';
     revealCard.visible=true;
     const u=ease((q-.55)/1.05);
     revealCard.position.set(-.43+.86*u,.86+.16*Math.sin(Math.PI*u),.18);
     // A physical 180-degree turn around the card's long edge.
     revealCard.rotation.set(0,.1+Math.PI*u,0);
     // During the turn, reveal the actual opening card face, not a random card.
     if(!revealing&&u>=.5){
       revealing=true;
       const faceId=G.top!=null?G.top:(G.ds&&G.ds.length?G.ds[G.ds.length-1]:null);
       if(faceId!=null){const actual=card(faceId);if(actual.material){
         // Reuse the game's existing card-face material, preserving suit/rank.
         revealCard.material=actual.material;
       }actual.geometry.dispose();}
     }
   }
   if(q>1.9){stop();return}
  }
 }

})();
